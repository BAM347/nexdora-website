<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nexdora Technologies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>Nexdora Technologies</h2>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="page-content">
        <h1>Contact Us</h1>
        <p>Have a question or want to work with us? Send us a message below.</p>

        <form id="contact-form" action="https://formspree.io/f/xLjdbnqd" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p id="form-status"></p>

        <p><strong>Email:</strong> nexdoratech@gmail.com</p>
        <p><strong>Phone:</strong> +234 85877707</p>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const status = document.getElementById('form-status');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    status.textContent = "Thanks! Your message has been sent.";
                    form.reset();
                } else {
                    status.textContent = "Something went wrong. Please try again.";
                }
            } catch (error) {
                status.textContent = "Something went wrong. Please try again.";
            }
        });
    </script>
</body>
</html>
